name: Supabase Keepalive

on:
  schedule:
    # Diario a las 09:00 UTC. Supabase free pausa tras ~7 dias sin actividad de DB,
    # asi que correr a diario deja margen para absorber hasta 6 fallos seguidos del runner.
    - cron: '0 9 * * *'
  workflow_dispatch:

# Evita que dos runs (ej. schedule + dispatch) se pisen.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Postgres via PostgREST (HEAD + count=exact, con reintentos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # -u: var sin definir es error. NO usamos -e: manejamos los reintentos a mano.
          set -uo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Missing required secrets SUPABASE_URL and/or SUPABASE_ANON_KEY"
            exit 1
          fi

          # Normaliza la URL: saca espacios/saltos de linea y una posible barra final.
          # (un secret con un espacio o newline al final hace que curl falle con
          #  "Could not resolve host" aunque el proyecto este perfectamente vivo).
          base_url="$(printf '%s' "${SUPABASE_URL}" | tr -d '[:space:]')"
          base_url="${base_url%/}"

          headers_file="$(mktemp)"
          attempts=4
          delay=15
          http_code="000"
          ok=0

          for i in $(seq 1 "${attempts}"); do
            echo "Attempt ${i}/${attempts} ..."

            # HEAD con Prefer: count=exact obliga a Postgres a ejecutar un SELECT count(*)
            # sobre la tabla -> hit real a la DB, no solo al API gateway.
            # --retry* cubre errores transitorios DENTRO de un intento; el loop externo
            # cubre fallos duros de resolucion/conexion (glitches de DNS del runner).
            # Sin body en la respuesta = cero riesgo de loguear datos.
            http_code="$(curl -sS \
              --head \
              --connect-timeout 15 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --retry-connrefused \
              -D "${headers_file}" \
              -o /dev/null \
              -w '%{http_code}' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Prefer: count=exact" \
              "${base_url}/rest/v1/GiftCard?select=*&limit=1")" || http_code="000"

            echo "  -> HTTP ${http_code}"

            if [[ "${http_code}" =~ ^[0-9]+$ && "${http_code}" -ge 200 && "${http_code}" -lt 300 ]]; then
              ok=1
              break
            fi

            if [[ "${i}" -lt "${attempts}" ]]; then
              echo "  retrying in ${delay}s ..."
              sleep "${delay}"
            fi
          done

          echo "--- response headers (safe subset) ---"
          grep -iE '^(content-range|content-type|date|server):' "${headers_file}" || true
          echo "--------------------------------------"

          if [[ "${ok}" -ne 1 ]]; then
            echo "::error::Keep-alive failed after ${attempts} attempts (last HTTP ${http_code}). Check RLS on GiftCard or the SUPABASE_URL/ANON_KEY secrets."
            exit 1
          fi

          echo "Keep-alive OK (HTTP ${http_code}). content-range arriba = SELECT count(*) real contra Postgres."
